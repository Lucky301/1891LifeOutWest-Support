name: 버그 제보 / Bug report
description: 개인정보 없이 일반적인 문제를 알려주세요. / Report an issue without personal information.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        이 내용은 공개됩니다. 이메일·영수증·저장 파일·암호를 올리지 마세요.
        This report is public. Do not include emails, receipts, save files or passwords.
        Private support: support@supracore.co.kr
  - type: input
    id: app-version
    attributes:
      label: 앱 버전 / App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: device-os
    attributes:
      label: 기기·운영체제 / Device and OS
      placeholder: "iPhone / iPad / Mac, OS version"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서 / Steps to reproduce
      description: 어떤 화면에서 어떤 동작을 했는지 알려주세요. / Describe the screen and actions.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 예상·실제 동작 / Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 게시물 확인 / Public report
      options:
        - label: 개인정보를 포함하지 않았습니다. / I have not included personal information.
          required: true
